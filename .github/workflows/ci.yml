name: CI

on:
          node-version: '20'
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
        working-directory: ./subscriptionservice
        run: mvn -B test

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          name: CI (disabled)

          on:
            workflow_dispatch:

          jobs:
            noop:
              runs-on: ubuntu-latest
              steps:
                - run: echo "Old workflow disabled; using .github/workflows/ci-fixed.yml instead"
    steps:
