name: CI

on:
  push:
    branches: [ main, master, '**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run backend tests
        working-directory: ./subscriptionservice
        run: mvn -B test

  postman:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Start backend
        working-directory: ./subscriptionservice
        run: mvn -DskipTests -q spring-boot:run &

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -sSf "http://localhost:8080/actuator/health" >/dev/null 2>&1; then
              echo "Backend is up"; break;
            fi
            echo "Waiting for backend..."; sleep 2;
          done

      - name: Install newman and run Postman collection
        run: |
          npm i -g newman
          newman run postman/SubTrack.postman_collection.json --env-var baseUrl=http://localhost:8080
